[pytest]
testpaths = testcases
addopts =
    --alluredir=allure-results
    --clean-alluredir
    -p no:cacheprovider
markers =
    android: 仅 Android 平台运行
    ios: 仅 iOS 平台运行
    generic: 平台无关的通用用例
    smoke: 冒烟级用例
    demo: 示例用例(需加 --with-demo 才会执行)
    selfcheck: 框架自检(纯逻辑, 不依赖设备)
filterwarnings =
    ignore::DeprecationWarning
log_cli = false
